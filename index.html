  <!-- Filtros de dibujo: borde de tinta tembloroso y manchas de acuarela -->
  <svg class="filtros" aria-hidden="true" focusable="false">
    <filter id="contorno" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="3.4" result="fuera"/>
      <feMorphology in="SourceAlpha" operator="dilate" radius="2.2" result="dentro"/>
      <feComposite in="fuera" in2="dentro" operator="out" result="anillo"/>
      <feFlood flood-color="#1C1A1E"/>
      <feComposite in2="anillo" operator="in" result="linea"/>
      <feMerge><feMergeNode in="linea"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tinta" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="1" seed="7" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="mancha" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="3" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="46" xChannelSelector="R" yChannelSelector="G" result="forma"/>
      <feGaussianBlur in="forma" stdDeviation="1.2"/>
    </filter>
  </svg>
