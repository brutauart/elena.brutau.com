<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elena Brutau</title>
  <meta name="description" content="Un acceso a la mente de Elena Brutau: libretas con su arte, sus escritos, las cosas que ve y sus piezas de clay.">
  <meta property="og:title" content="Elena Brutau">
  <meta property="og:description" content="Entra y saca una libreta.">
  <meta name="theme-color" content="#E6E0D9">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='14' y='6' width='36' height='52' rx='5' fill='%23262523'/%3E%3Crect x='42' y='6' width='3' height='52' fill='%23000'/%3E%3Crect x='20' y='26' width='20' height='8' rx='1' fill='%23D9A63A'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=Courier+Prime:wght@400;700&family=IM+Fell+English:ital@0;1&family=Sacramento&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Filtros de dibujo: borde de tinta tembloroso y manchas de acuarela -->
  <svg class="filtros" aria-hidden="true" focusable="false">
    <filter id="tinta" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="1" seed="7" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="pincel" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="grano"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="onda"/>
      <feDisplacementMap in="SourceGraphic" in2="onda" scale="7" xChannelSelector="R" yChannelSelector="G" result="forma"/>
      <feComposite in="forma" in2="grano" operator="arithmetic" k1="0" k2="1" k3="-0.35" k4="0"/>
    </filter>
    <filter id="mancha" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="3" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="46" xChannelSelector="R" yChannelSelector="G" result="forma"/>
      <feGaussianBlur in="forma" stdDeviation="1.2"/>
    </filter>
  </svg>

  <!-- Idioma -->
  <div class="idiomas" role="group" aria-label="Idioma / Language">
    <button type="button" data-idioma="es" lang="es" aria-pressed="true">ES</button><span aria-hidden="true">/</span><button type="button" data-idioma="en" lang="en" aria-pressed="false">EN</button>
  </div>

  <!-- La entrada: una cerradura y una llave -->
  <div class="entrada" id="entrada">
    <p class="encabezado">elenabrutau.com</p>
    <div class="entrada-centro">
      <svg class="cerradura" viewBox="0 0 120 190" aria-hidden="true">
        <path class="mancha-gris" d="M20 40 C10 90 30 170 70 175 C120 180 112 70 96 30 C84 2 30 0 20 40Z"/>
        <g class="trazo">
          <rect x="22" y="12" width="76" height="160" rx="38"/>
          <rect x="30" y="20" width="60" height="144" rx="30" stroke-width="1"/>
          <circle cx="60" cy="34" r="3"/><circle cx="60" cy="150" r="3"/>
        </g>
        <path d="M60 66 a11 11 0 0 1 6 20 l7 32 h-26 l7-32 a11 11 0 0 1 6-20z" fill="#262523"/>
      </svg>
      <button class="llave" id="llave" type="button">
        <svg class="llave-dibujo" viewBox="0 0 70 190" aria-hidden="true">
          <g class="trazo">
            <circle cx="35" cy="30" r="24" fill="#D9A63A"/>
            <circle cx="35" cy="30" r="11" fill="#E6E0D9"/>
            <path d="M28 54 V168 H42 V54" fill="#D9A63A"/>
            <path d="M42 150 H56 V160 H48 V168 H42 Z M42 128 H52 V138 H42" fill="#D9A63A"/>
            <path d="M22 18 q-4 8 0 16" stroke-width="1.2"/>
            <path d="M33 70 V150" stroke-width="1"/>
          </g>
          <path d="M8 6 l4 8 M4 10 l12 0" class="trazo" stroke-width="1.2"/>
        </svg>
        <span class="llave-texto" data-t="entrar">gira la llave para entrar</span>
      </button>
    </div>
  </div>

  <!-- La habitación -->
  <main class="cuarto" id="cuarto" aria-label="Estante de libretas de Elena Brutau">
    <p class="encabezado"><span class="fecha-txt" data-t="fecha">Fecha:</span> <span id="fecha"></span><span class="sep"> / </span>elenabrutau.com</p>

    <!-- La lámpara -->
    <svg class="lampara" viewBox="0 0 200 260" aria-hidden="true">
      <g class="rayos trazo" stroke-width="2">
        <path d="M100 222 v22 M62 210 l-14 16 M138 210 l14 16 M44 186 l-20 4 M156 186 l20 4"/>
      </g>
      <g class="trazo">
        <path d="M100 0 V118" stroke-width="1.6"/>
        <path d="M96 118 h8 v10 h-8z" fill="#262523"/>
        <path d="M78 128 C70 128 46 170 40 186 H160 C154 170 130 128 122 128 Z" fill="#F6F4EF"/>
        <path d="M56 160 L70 136 M66 170 L80 138 M78 178 L88 140" stroke-width="1"/>
        <path d="M84 186 a16 16 0 0 0 32 0" class="bombilla"/>
      </g>
    </svg>

    <!-- Manchas, garabatos y pegatinas en la pared -->
    <div class="pared" aria-hidden="true">
      <svg class="mancha-grande" viewBox="0 0 600 420"><path d="M70 230 C40 120 180 40 300 60 C440 80 560 140 540 260 C520 360 380 400 260 380 C140 360 95 320 70 230Z"/></svg>
      <svg class="aro" viewBox="0 0 300 300"><path d="M260 120 A115 115 0 1 0 210 245" /></svg>
      <svg class="garabato g1" viewBox="0 0 40 40"><path d="M6 20 h28 M20 5 v30 M9 9 l22 22 M31 9 L9 31"/></svg>
      <svg class="garabato g2" viewBox="0 0 40 40"><path d="M8 22 l12 -14 l3 22 l10 -16"/><path d="M6 14 l26 12"/></svg>
      <svg class="estrella e1" viewBox="0 0 100 100"><path d="M50 2 L58 38 L96 26 L66 52 L92 86 L54 66 L40 98 L38 62 L4 70 L30 46 L10 14 L44 32 Z"/></svg>
      <svg class="estrella e2" viewBox="0 0 100 100"><path d="M50 4 L60 40 L98 50 L60 60 L50 96 L40 60 L2 50 L40 40 Z"/></svg>
      <svg class="sello" viewBox="0 0 80 80"><circle cx="40" cy="40" r="34"/><path d="M40 20 v26 M40 56 v4"/></svg>
      <span class="pegatina-mostaza"></span>
      <span class="pegatina-oxido"></span>
    </div>

    <h1 class="sr-only">Elena Brutau</h1>

    <section class="estante">
      <div class="libros" id="libros" role="list"></div>
      <svg class="tabla" viewBox="0 0 1000 40" preserveAspectRatio="none" aria-hidden="true">
        <path d="M2 4 H998 V22 H2 Z" fill="#F6F4EF"/>
        <g class="trazo" stroke-width="2" vector-effect="non-scaling-stroke">
          <path d="M2 4 H998 V22 H2 Z" vector-effect="non-scaling-stroke"/>
          <path d="M120 22 V36 M880 22 V36" vector-effect="non-scaling-stroke"/>
        </g>
        <g class="trazo" stroke-width="1" vector-effect="non-scaling-stroke">
          <path d="M20 22 l10 -18 M40 22 l10 -18 M60 22 l10 -18 M940 22 l10 -18 M960 22 l10 -18 M980 22 l10 -18" vector-effect="non-scaling-stroke"/>
        </g>
      </svg>
      <p class="placa-nombre">Elena Brutau</p>
    </section>

    <p class="pista" data-t="pista">saca una libreta para abrirla</p>
  </main>

  <!-- La libreta abierta -->
  <div class="lector" id="lector" hidden>
    <div class="fondo-lector" data-cerrar></div>
    <div class="libreta" id="libreta" role="dialog" aria-modal="true" aria-labelledby="titulo-libreta">
      <div class="contratapa"><div class="hoja hoja-der" id="hoja-der" tabindex="-1"></div></div>
      <div class="tapa" id="tapa">
        <div class="tapa-frente">
          <span class="elastico"></span>
          <span class="cinta-tapa" id="cinta-tapa"></span>
        </div>
        <div class="tapa-dorso"><div class="hoja hoja-izq" id="hoja-izq"></div></div>
      </div>
    </div>
    <button class="volver" id="volver" type="button" data-cerrar data-t="volver">devolver al estante</button>
  </div>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
